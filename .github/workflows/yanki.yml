name: Yanki Raporu

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

concurrency:
  group: yanki-tektir
  cancel-in-progress: false

jobs:
  yanki:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yanki analizi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python yanki.py
